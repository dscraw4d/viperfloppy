name: Build Windows EXE

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Pin to the VS 2022 image for a stable MSVC/Windows SDK toolchain.
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build x64 executable with MSVC
        shell: cmd
        run: build-local.cmd

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "bin\Viper-Universal-Windows-10-Floppy-Driver.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Viper-Universal-Windows-10-Floppy-Driver.exe" | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Viper-Universal-Windows-10-Floppy-Driver
          path: |
            bin/Viper-Universal-Windows-10-Floppy-Driver.exe
            SHA256SUMS.txt
